name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match Home Assistant's runtime (2026.11 requires 3.14).
          python-version: "3.14"
          cache: pip
          # No requirements.txt/pyproject.toml here; without this the cache
          # lookup fails the step.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check custom_components/lexman_ble tests

      - name: Run ruff format check
        run: ruff format --check custom_components/lexman_ble tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v tests

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # hassfest ships inside Home Assistant Core (script/hassfest), not as a
      # pip package; the official Docker action runs it against the checkout.
      - name: Run hassfest
        uses: https://github.com/home-assistant/actions/hassfest@master
